pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{c,cpp,h,hpp}"
      run: clang-format --dry-run -Werror {staged_files}
    rumdl:
      glob: "*.md"
      run: rumdl check {staged_files}
    shfmt:
      glob: "*.sh"
      run: shfmt -d {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    hadolint:
      glob: "**/Dockerfile"
      run: hadolint {staged_files}
    gersemi:
      glob: "**/CMakeLists.txt"
      run: gersemi --check {staged_files}
pre-push:
  parallel: true
  commands:
    # Route by layer to the correct compile DB — do NOT use `||` exit-code
    # fallback (clang-tidy exits non-zero on real findings, which would then
    # spuriously re-run against the wrong DB and mask the error).
    tidy-core:
      glob: "firmware/src/core/*.{c,cpp}"
      run: clang-tidy -p build-host {files}
    tidy-hal-app:
      glob: "firmware/src/{hal,app}/*.{c,cpp}"
      run: clang-tidy -p build-pico {files}
    # Unconditional (no glob): a submodule/vendored license-text change does not
    # stage THIRD_PARTY_LICENSES.md, so run every push. Mirrors ci/run.sh.
    third-party-licenses:
      run: scripts/gen-third-party-licenses.sh --check
