; SRV250 default configuration. Edit on the mounted USB drive; need reboot.

; Run mode: STEPPED | RAMP_UP | RAMP_DOWN | HOLD (picks the block used below).
RUN_MODE            = STEPPED

; STEPPED sweep: start->end inclusive by step. Also bounds the RAMP modes.
SWEEP_START_RPM     = 100
SWEEP_END_RPM       = 10000
SWEEP_STEP_RPM      = 100
; Revs to settle at each step before sampling, and samples reduced per step.
SWEEP_SETTLE_REVS   = 8
SWEEP_SAMPLES       = 16

; HOLD mode: constant RPM held indefinitely (optional; firmware default if omitted).
HOLD_RPM            = 3000

; RAMP modes: slew rate across the sweep span, in rpm per second.
RAMP_UP_RPM_PER_S   = 500
RAMP_DOWN_RPM_PER_S = 500
