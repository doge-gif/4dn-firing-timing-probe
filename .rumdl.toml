# rumdl configuration for 4dn-firing-timing-probe
# Reference documents (docs/, README.md) contain long lines, large tables,
# bare URLs, and dense formatting generated by design tooling — relax those
# rules project-wide rather than editing the reference content.

[global]
exclude = [
    ".git",
    "node_modules",
    "build",
    "build-host",
    "build-host-ci",
    "build-pico",
    "build-pico-ci",
    "firmware/external",
]
respect-gitignore = true

# Rules disabled because they fire on reference/design documents that must
# not be reformatted:
#   MD013 – line-length: tables and long technical lines in design docs
#   MD031 – fenced code blocks surrounded by blank lines: dense doc style
#   MD032 – lists surrounded by blank lines: dense doc style
#   MD034 – bare URLs: SOURCES.md lists plain URLs intentionally
#   MD040 – code block language: README quick-start snippets lack lang tag
#   MD076 – list item spacing: mixed tight/loose lists in design docs
disable = [
    "MD013",
    "MD031",
    "MD032",
    "MD034",
    "MD040",
    "MD076",
]
